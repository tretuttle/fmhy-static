\* Smaller config for drawing the user-flow chart (360 states, under the
\* /statechart chart budget): one colour (the default), one preset (Halloween).
CONSTANTS
    Accents = {"swarm"}
    Presets = {"halloween"}
    StaleNames = {"retired"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoFlipOnLoad
    ModeSticks
    PaletteSticks
    FollowsOsUntilPicked
    PaletteSavedOnlyWhenPicked
    AmoledOnlyInDark
PROPERTIES
    CanFollowOsAgain
