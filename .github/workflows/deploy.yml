name: Deploy fmhy-static

# Proactive 1:1 mirror: poll fmhy/edit hourly and rebuild ONLY when upstream
# actually moved, so the mirror lags the real site by at most ~1 hour.
#
# Cost math (private repo, 2,000 free Actions min/mo; every job bills a 1-min
# minimum): 24 hourly polls/day ≈ 720 min/mo, plus a ~7-min full pipeline only
# on the handful of days-parts upstream changed (~600 min/mo at 3 changes/day)
# ≈ 1,350 min/mo total. A 30-min cadence would blow the budget on polls alone;
# making the repo public would make any cadence free.
#
# The full pipeline clones fmhy/edit, regenerates our Tamagui dataset, runs
# THEIR vitepress build on the same commit, and parity-checks our data against
# the exact HTML fmhy.net serves — a deploy only happens when the mirror
# provably carries everything the real site renders. EAS Hosting has no
# deployment-count cap on the free plan, so deploy-on-change is safe.
on:
  schedule:
    - cron: '7 * * * *' # hourly at :07 (top-of-hour cron slots run late)
  workflow_dispatch: {} # manual runs always do the full pipeline

permissions:
  # the deploy job records the last-deployed upstream sha as a committed file
  # (.github/last-deployed-upstream-sha) — an audit trail of what shipped when,
  # and writable by the workflow token (the Actions-variables API is not)
  contents: write

# never let an hourly run and a manual run deploy at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ---- cheap gate: has fmhy/edit moved since the last successful deploy? ----
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Compare upstream HEAD to last deployed sha
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote https://github.com/fmhy/edit.git refs/heads/main | cut -f1)
          last=$(gh api "repos/${{ github.repository }}/contents/.github/last-deployed-upstream-sha" \
                   --jq .content 2>/dev/null | base64 -d | tr -d '[:space:]' || echo "none")
          echo "upstream: $sha · last deployed: $last"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$sha" != "$last" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # ---- full pipeline: only when upstream moved (or manual) ------------------
  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # node for fmhy/edit's own toolchain (engines: ^22.13 || >=24); corepack
      # picks up their pinned pnpm from packageManager automatically
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Enable corepack (their pinned pnpm)
        run: corepack enable

      - name: Install site dependencies
        run: bun install

      # clone/update fmhy/edit into .fmhy-edit, pnpm-install it, regenerate
      # the wiki dataset + routes from it
      - name: Sync fmhy/edit + regenerate
        run: bun scripts/sync-fmhy.ts --install

      # their build of the same commit = the exact HTML fmhy.net serves
      - name: Build upstream site (parity reference)
        run: corepack pnpm docs:build
        working-directory: site/.fmhy-edit

      # the 1:1 gate — every external link their HTML renders must be in our
      # generated data, or the deploy stops here
      - name: Parity check (ours vs theirs, same commit)
        run: bun scripts/parity-check.ts

      - name: Build static site
        run: bun run build

      # Deploy only dist/client (the static SSG output). Deploying the full
      # dist/ stands up One's server worker, which EAS Hosting can't route
      # (every path 404s). Static client → EAS serves the HTML with clean URLs.
      - name: Deploy to EAS Hosting (production)
        run: bunx eas-cli@latest deploy --prod --export-dir=dist/client --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # only after a successful deploy — a failed run leaves the record
      # untouched, so the next hourly poll retries automatically. A committed
      # file (not an Actions variable: that API 403s the workflow token) —
      # doubling as a git-log audit trail of exactly what shipped when.
      - name: Record deployed upstream sha
        working-directory: .
        run: |
          echo "${{ needs.check.outputs.sha }}" > .github/last-deployed-upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-deployed-upstream-sha
          git commit -m "chore: deployed fmhy/edit @ ${{ needs.check.outputs.sha }}"
          # the build leaves regenerated files unstaged in this checkout —
          # autostash them if a rebase is needed at all (concurrency group
          # already serializes deploys, so this is belt-and-suspenders)
          git push origin main || (git pull --rebase --autostash origin main && git push origin main)
