\* For drawing the main flow with /statechart only (not part of check.sh).
\* Small on purpose: one new commit, parity and the record push may fail,
\* no run waits in the concurrency queue (ChartLimit). R4 is left out: it
\* breaks on every red run (F6) and would mark every failure state.
SPECIFICATION Spec
CONSTANTS
  MaxUp = 1
  MaxSite = 1
  Flaky = {"parity", "push"}
  CanDisable = FALSE
CONSTRAINT ChartLimit
INVARIANTS
  ChangesGoLive
  RecordIsTrue
  HourlyDeploysOnlyOnChange
  RedRunShippedNothing
  GreenShipsComplete
  OnlyParityCheckedBuildsGoLive
  FailedRunLeavesRecord
  LiveNeverGoesBack
