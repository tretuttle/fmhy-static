\* expect: RecordIsTrue
\* F2: a failed git ls-remote records an empty sha after a real deploy.
SPECIFICATION Spec
CONSTANTS
  MaxUp = 2
  MaxSite = 1
  Flaky = {"lsremote", "ghapi", "sync", "upbuild", "parity", "build", "fonts", "singlepage", "eas", "push"}
  CanDisable = TRUE
INVARIANTS
  RecordIsTrue
