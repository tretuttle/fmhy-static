\* For /statechart only: the record and redeploy findings (F3-F5, F8) at the
\* full check bounds. Only ls-remote, gh api and the record push may fail:
\* with every failure on, TLC's shortest paths all pick the font failure
\* and the paths blur together (F7 has its own finding config). R4 is left
\* out: it breaks on every red run (F6). Too many states for a whole chart,
\* so /statechart draws only the shortest path to each broken rule.
SPECIFICATION Spec
CONSTANTS
  MaxUp = 2
  MaxSite = 1
  Flaky = {"lsremote", "ghapi", "push"}
  CanDisable = TRUE
INVARIANTS
  ChangesGoLive
  RecordIsTrue
  HourlyDeploysOnlyOnChange
  RedRunShippedNothing
  GreenShipsComplete
  OnlyParityCheckedBuildsGoLive
  FailedRunLeavesRecord
  LiveNeverGoesBack
