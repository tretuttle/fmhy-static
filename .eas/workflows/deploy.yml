name: Deploy fmhy-static

# Scheduled content refresh: pull the latest fmhy/edit docs, regenerate the
# blog posts, rebuild the static site, and deploy to EAS Hosting.
# Runs on EAS infra, authenticated to the fmhy-static project automatically.
# (Scheduled workflows only run on the default branch — `main`.)
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {} # manual "Run workflow" button

defaults:
  run:
    working_directory: ./site # the takeout-static app lives in site/
  tools:
    bun: 1.3.9

jobs:
  deploy:
    name: Sync fmhy content, build, deploy
    steps:
      - uses: eas/checkout
      - name: Ensure fmhy/edit upstream remote
        run: git remote add upstream https://github.com/fmhy/edit.git || true
      - name: Install dependencies
        run: bun install
      - name: Sync fmhy content + regenerate posts
        run: bun scripts/sync-fmhy.ts
      - name: Build static site
        run: bun run build
      - name: Deploy to EAS Hosting (production)
        run: eas deploy --prod --export-dir=dist --non-interactive
